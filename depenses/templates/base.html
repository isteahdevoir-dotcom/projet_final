<!DOCTYPE html>
<html>
<head>
    <title>Gestion Dépenses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #d4edda;
        }

        .navbar {
            background-color: #155724;
        }

        .btn-custom {
            background-color: #1e7e34;
            color: white;
        }

        .btn-custom:hover {
            background-color: #145c25;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4">
    <span class="navbar-brand">💰 Gestion Dépenses Personnelles</span>

    <div>
        {% if user.is_authenticated %}

            
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button class="btn btn-danger">Logout</button>
            </form>

        {% else %}
            <a href="{% url 'login' %}" class="btn btn-light">Login</a>
            <a href="{% url 'register' %}" class="btn btn-success">Inscription</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
