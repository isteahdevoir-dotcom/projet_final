{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow">

            <h3 class="mb-4">Ajouter / Modifier une dépense</h3>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-custom w-100">
                    Enregistrer
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
