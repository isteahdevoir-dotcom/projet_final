{% extends 'base.html' %}

{% block content %}

<div class="card p-4 shadow">
    <h2 class="mb-4">Mes dépenses</h2>

    <a href="{% url 'ajouter_depense' %}" class="btn btn-custom mb-3">
        ➕ Ajouter une dépense
    </a>

    <table class="table table-hover">
        <thead class="table-success">
            <tr>
                <th>Titre</th>
                <th>Montant</th>
                <th>Catégorie</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for depense in depenses %}
            <tr>
                <td>{{ depense.titre }}</td>
                <td>{{ depense.montant }} $</td>
                <td>{{ depense.categorie }}</td>
                <td>{{ depense.date }}</td>
                <td>
                    <a href="{% url 'modifier_depense' depense.id %}" class="btn btn-warning btn-sm">
                        Modifier
                    </a>
                    <a href="{% url 'supprimer_depense' depense.id %}" class="btn btn-danger btn-sm">
                        Supprimer
                    </a>
                    <a href="{% url 'detail_depense' depense.id %}" class="btn btn-info btn-sm">
                        Détail
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
