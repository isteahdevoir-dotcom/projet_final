{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow">

            <h3 class="text-center mb-4">Inscription</h3>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-custom w-100">
                    S'inscrire
                </button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
